name: Czujnik radaru

# Ostatnia linia obrony: wszystkie alarmy Głosu Czemiernik biegną przez serwer
# w Hetznerze, więc padnięty kontener albo padnięta maszyna wyglądają dokładnie
# tak samo jak spokój. Ten czujnik stoi poza tą maszyną i pyta radar z zewnątrz.
#
# Co go uruchamia (23.09.2026):
# - push na gałąź `puls`: dozór na serwerze (/opt/glos-radar/doglad.sh) co 15 minut
#   wypycha tam pusty commit kluczem wdrożeniowym. Zdarzeń push GitHub nie dławi,
#   w przeciwieństwie do harmonogramu, który przy */5 szedł raz na 2–5 godzin;
# - schedule: zapas na wypadek, gdy pulsu nie ma (padł serwer; tę samą sytuację
#   po 40 minutach zgłasza też martwy człowiek w ntfy);
# - workflow_dispatch: ręcznie.

on:
  push:
    branches: [puls]
  schedule:
    # nie o pelnych dziesiatkach: GitHub opoznia harmonogramy w szczycie,
    # a szczyt to poczatek kazdej godziny
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: czujnik
  cancel-in-progress: false

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ADRES: https://inoreader.fg.pl/radar/health
      PANEL: https://redaktor.fg.pl
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Zapytaj radar (trzy podejścia, żeby chwilowa sieć nie budziła redakcji)
        id: pytanie
        run: |
          zyje=0; signal=nieznany; model=nieznany; kod=000; tresc=""; stoi=nie; malo_miejsca=nie; wiek=-1; dysk=-1
          for proba in 1 2 3; do
            kod=$(curl -s -o odp.json -w '%{http_code}' --max-time 20 "$ADRES" || true)
            [ -z "$kod" ] && kod=000
            # 503 znaczy „Signal odłączony", ale sam radar odpowiada: to nie awaria serwera
            if [ "$kod" = "200" ] || [ "$kod" = "503" ]; then
              if grep -q '"wersja"' odp.json; then zyje=1; break; fi
            fi
            if [ "$proba" -lt 3 ]; then sleep 20; fi
          done
          if [ "$zyje" = "1" ]; then
            tresc=$(head -c 300 odp.json | tr -d '\n')
            if grep -q '"signal":true' odp.json; then signal=ok; else signal=padl; fi
            if grep -q '"dify":true' odp.json; then model=ok; else model=padl; fi
            wiek=$(python3 -c "import json; d=json.load(open('odp.json')); print(d.get('zbiorka_wiek_min', -1) if d.get('zbiorka_wiek_min') is not None else -1)")
            dysk=$(python3 -c "import json; d=json.load(open('odp.json')); print(d.get('dysk_wolne_mb', -1) if d.get('dysk_wolne_mb') is not None else -1)")
            # Czy zbiorka naprawde stoi, liczy serwer: tylko on wie, jakie jest okno
            # skanowania i co ile minut radar zbiera. Tutaj czytamy gotowy werdykt.
            stoi=$(python3 -c "import json; d=json.load(open('odp.json')); print('tak' if d.get('zbiorka_stoi') else ('nie' if 'zbiorka_stoi' in d else 'nieznany'))")
            if [ "$dysk" -ge 0 ] && [ "$dysk" -lt 400 ] 2>/dev/null; then malo_miejsca=tak; fi
          fi
          {
            echo "zyje=$zyje"
            echo "kod=$kod"
            echo "signal=$signal"
            echo "model=$model"
            echo "stoi=$stoi"
            echo "malo_miejsca=$malo_miejsca"
            echo "wiek=$wiek"
            echo "dysk=$dysk"
            echo "tresc=$tresc"
          } >> "$GITHUB_OUTPUT"
          echo "radar=$zyje kod=$kod signal=$signal model=$model zbiorka_min=$wiek dysk_mb=$dysk"

      - name: Alarm albo odwołanie alarmu
        env:
          ZYJE: ${{ steps.pytanie.outputs.zyje }}
          KOD: ${{ steps.pytanie.outputs.kod }}
          SIGNAL: ${{ steps.pytanie.outputs.signal }}
          TRESC: ${{ steps.pytanie.outputs.tresc }}
          STOI: ${{ steps.pytanie.outputs.stoi }}
          MALO: ${{ steps.pytanie.outputs.malo_miejsca }}
          WIEK: ${{ steps.pytanie.outputs.wiek }}
          DYSK: ${{ steps.pytanie.outputs.dysk }}
        run: |
          teraz=$(TZ=Europe/Warsaw date '+%d.%m.%Y %H:%M')
          push () {  # $1 tytuł, $2 treść, $3 priorytet, $4 tag
            if [ -z "$NTFY_TOPIC" ]; then return 0; fi
            curl -s --max-time 15 -H "Title: $1" -H "Priority: $3" -H "Tags: $4" -H "Click: $PANEL" \
              -d "$2" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
          }
          otwarte () { gh issue list --repo "$REPO" --label "$1" --state open --limit 1 --json number -q '.[0].number'; }

          nr=$(otwarte radar-down)
          if [ "$ZYJE" = "0" ] && [ -z "$nr" ]; then
            body=$(printf '%s\n' \
              "@Asystent-AI Radar Głosu Czemiernik nie odpowiada na $ADRES (trzy podejścia, ostatni kod HTTP: $KOD)." \
              "" \
              "Nie działa więc także wszystko, co biegnie przez tamten serwer: alerty pilne na Signal, digesty, ranking tematów, panel i kanał RSS alarmów." \
              "" \
              "Co sprawdzić po kolei:" \
              "1. ssh root@204.168.196.86 oraz docker ps | grep glos-radar" \
              "2. cd /opt/glos-radar && docker compose up -d glos-radar" \
              "3. docker logs --tail 100 glos-radar" \
              "" \
              "Ten wpis zamknie się sam, gdy radar znów zacznie odpowiadać.")
            gh issue create --repo "$REPO" --label radar-down --title "🚨 Radar nie odpowiada ($teraz)" --body "$body"
            push "RADAR NIE ODPOWIADA" "Serwer radaru milczy ($teraz). Alerty, digesty i panel nie działają." urgent rotating_light
          elif [ "$ZYJE" = "1" ] && [ -n "$nr" ]; then
            gh issue comment "$nr" --repo "$REPO" --body "✅ Radar znów odpowiada ($teraz). Odpowiedź: $TRESC"
            gh issue close "$nr" --repo "$REPO"
            push "Radar znów odpowiada" "Serwer wrócił ($teraz)." default white_check_mark
          fi

          nrs=$(otwarte signal-down)
          if [ "$ZYJE" = "1" ] && [ "$SIGNAL" = "padl" ] && [ -z "$nrs" ]; then
            body=$(printf '%s\n' \
              "@Asystent-AI Radar działa, ale zgłasza signal: false, czyli nie ma jak wysłać alertów ani digestu." \
              "" \
              "Podłączenie: panel $PANEL → Ustawienia → Signal → kod QR (w telefonie: Signal → Ustawienia → Urządzenia połączone).")
            # push o Signalu wysyła już dozór na serwerze (po 20 minutach 503); tu tylko zgłoszenie i e-mail
            gh issue create --repo "$REPO" --label signal-down --title "⚠️ Signal radaru odłączony ($teraz)" --body "$body"
          elif [ "$ZYJE" = "1" ] && [ "$SIGNAL" = "ok" ] && [ -n "$nrs" ]; then
            gh issue comment "$nrs" --repo "$REPO" --body "✅ Signal znów podłączony ($teraz)."
            gh issue close "$nrs" --repo "$REPO"
          fi

          # radar odpowiada, ale nic nie robi: zamarły harmonogram albo pełny dysk
          nrp=$(otwarte radar-stoi)
          stoi_teraz=nie
          if [ "$ZYJE" = "1" ] && { [ "$STOI" = "tak" ] || [ "$MALO" = "tak" ]; }; then stoi_teraz=tak; fi
          if [ "$stoi_teraz" = "tak" ] && [ -z "$nrp" ]; then
            body=$(printf '%s\n' \
              "@Asystent-AI Radar odpowiada na health, ale przestał pracować." \
              "" \
              "Ostatnia zbiórka źródeł: $WIEK minut temu (normalnie co 30 minut)." \
              "Wolne miejsce na dysku: $DYSK MB." \
              "" \
              "Prawdopodobne przyczyny: zawieszony harmonogram w kontenerze albo pełny dysk serwera." \
              "Sprawdzić: docker logs --tail 200 glos-radar oraz df -h na 204.168.196.86.")
            gh issue create --repo "$REPO" --label radar-stoi --title "⚠️ Radar odpowiada, ale stoi ($teraz)" --body "$body"
            push "Radar stoi" "Zbiórka źródeł milczy od $WIEK min, wolne $DYSK MB. Radar odpowiada, ale nie pracuje." high warning
          elif [ "$stoi_teraz" = "nie" ] && [ "$STOI" = "nie" ] && [ "$ZYJE" = "1" ] && [ -n "$nrp" ]; then
            gh issue comment "$nrp" --repo "$REPO" --body "✅ Radar znów pracuje ($teraz). Zbiórka: $WIEK min temu, wolne: $DYSK MB."
            gh issue close "$nrp" --repo "$REPO"
            push "Radar znów pracuje" "Zbiórka źródeł wróciła ($teraz)." default white_check_mark
          fi

      - name: Zgłoś niepowodzenie samego czujnika
        if: failure()
        run: |
          if [ -z "$NTFY_TOPIC" ]; then exit 0; fi
          curl -s --max-time 15 -H "Title: Czujnik radaru się wywrócił" -H "Priority: high" -H "Tags: warning" \
            -d "Zadanie GitHuba nie doszło do końca: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
